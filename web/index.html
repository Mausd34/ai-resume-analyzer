<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Resume Analyzer</title><style>body{font-family:Inter,Arial;max-width:850px;margin:40px auto;padding:20px;background:#f6f7fb}.panel{background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}textarea,input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px}button{cursor:pointer}.result{margin-top:20px;padding:18px;background:#f1f5f9;border-radius:12px}</style></head><body><div class="panel"><h1>AI Resume Analyzer</h1><p>Upload a PDF and compare it with a target job description.</p><input id="file" type="file" accept="application/pdf"><textarea id="job" rows="7" placeholder="Paste job description..."></textarea><button onclick="analyze()">Analyze Resume</button><div id="out" class="result">Ready.</div></div><script>async function analyze(){let f=file.files[0];if(!f||!job.value.trim()){out.textContent='Select a PDF and enter a job description.';return}let fd=new FormData();fd.append('resume',f);fd.append('job_description',job.value);let r=await fetch('/analyze',{method:'POST',body:fd});let x=await r.json();out.innerHTML='<h2>'+x.match_score+'%</h2><b>Matched:</b> '+(x.matched_skills||[]).join(', ')+'<br><b>Missing:</b> '+(x.missing_skills||[]).join(', ')}</script></body></html>
